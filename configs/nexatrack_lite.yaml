model:
  d_model: 192
  num_heads: 4
  encoder_layers: 3
  decoder_layers: 1
  ffn_dim: 768
  dropout: 0.1
  inner_dim: 48
  backbone_dims: [64, 128, 256]
  backbone_depths: [2, 2, 3]
  window_size: 7
  token_grid_template: [10, 10]
  token_grid_search: [16, 16]
  template_size: 180
  search_size: 320
  template_work_size: 192
  search_work_size: 320
  score_hidden: 192

train:
  epochs: 200
  batch_size: 8
  num_workers: 4
  lr_backbone: 0.00002
  lr_main: 0.0002
  weight_decay: 0.0001
  lr_drop_epoch: 160
  lr_drop_gamma: 0.1
  lambda_iou: 2.0
  lambda_l1: 5.0
  grad_clip: 1.0
  amp: true
  seed: 42

tracking:
  template_area_scale: 22.0
  search_area_scale: 52.0
  update_threshold: 0.65
  update_interval: 10

runtime:
  device: cuda
