[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexatrack"
version = "0.1.0"
description = "Context-aware cross-scale Transformer tracking for robust visual target localization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = []
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["nexatrack*"]
